name: Deploy

on:
  # every push to master deploys to production
  push:
    branches: [master]
    paths-ignore:
      - '**.md'
      - '.github/workflows/ftp-test.yml'
  # manual runs default to a dry run (builds the archive, uploads nothing)
  workflow_dispatch:
    inputs:
      dry_run:
        description: Only build the archive, do not upload
        type: boolean
        default: true

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # configure required reviewers on this environment for a manual approval step
    environment: production
    env:
      # pushes always deploy; manual runs default to a dry run, untick it to deploy for real
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
      FTP_DIR: ${{ vars.FTP_SERVER_DIR || secrets.FTP_SERVER_DIR }} # e.g. /www/ (ends with slash)
    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          tools: composer:v2
          extensions: mbstring, intl, gd, mysqli, xml, zip

      - name: Install PHP dependencies (WordPress core, plugins, vendor)
        # latte 2.11 (max PHP 8.3) and nette/caching 3.3 (max 8.4) don't declare 8.5 support yet, but run fine on it
        run: composer install --no-dev --no-interaction --optimize-autoloader --no-scripts --ignore-platform-req=php

      - name: Build assets
        run: |
          docker run --rm -v "$PWD":/var/www/html -w /var/www/html --entrypoint sh \
            mangoweb/mango-cli -c "npm install && mango build"
          # the container runs as root, give the files back to the runner user
          sudo chown -R "$(id -u):$(id -g)" node_modules public/assets package-lock.json
          test -d public/assets

      - name: Remove build leftovers
        run: |
          rm -rf temp/cache/* node_modules
          # webroot must not ship dev files
          rm -f public/info.php

      - name: Write config/.env from secrets
        shell: bash
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          WP_AUTH_KEY: ${{ secrets.WP_AUTH_KEY }}
          WP_SECURE_AUTH_KEY: ${{ secrets.WP_SECURE_AUTH_KEY }}
          WP_LOGGED_IN_KEY: ${{ secrets.WP_LOGGED_IN_KEY }}
          WP_NONCE_KEY: ${{ secrets.WP_NONCE_KEY }}
          WP_AUTH_SALT: ${{ secrets.WP_AUTH_SALT }}
          WP_SECURE_AUTH_SALT: ${{ secrets.WP_SECURE_AUTH_SALT }}
          WP_LOGGED_IN_SALT: ${{ secrets.WP_LOGGED_IN_SALT }}
          WP_NONCE_SALT: ${{ secrets.WP_NONCE_SALT }}
          GTM_ID: ${{ vars.GTM_ID || secrets.GTM_ID }} # not a secret, a variable is fine
          BUGSNAG_KEY: ${{ secrets.BUGSNAG_KEY }}
        run: |
          required="DB_HOST DB_NAME DB_USER DB_PASSWORD WP_AUTH_KEY WP_SECURE_AUTH_KEY WP_LOGGED_IN_KEY WP_NONCE_KEY WP_AUTH_SALT WP_SECURE_AUTH_SALT WP_LOGGED_IN_SALT WP_NONCE_SALT GTM_ID"
          optional="BUGSNAG_KEY"
          for key in $required; do
            if [ -z "${!key}" ]; then
              echo "::error::Secret $key is missing (set it in the 'production' environment)"
              exit 1
            fi
          done
          for key in $required $optional; do
            printf '%s=%s\n' "$key" "${!key}"
          done > config/.env

      - name: Check deploy settings
        env:
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
        run: |
          if [ -z "$FTP_DIR" ]; then
            echo "::error::FTP_SERVER_DIR is empty (set it as a variable or secret, e.g. /www/)"
            exit 1
          fi
          if [ "${#DEPLOY_TOKEN}" -lt 32 ]; then
            echo "::error::Secret DEPLOY_TOKEN is missing or shorter than 32 characters"
            exit 1
          fi

      # One archive instead of ~10 000 single uploads: the host drops long FTP sessions.
      # Paths that live only on the server (uploads, logs, cache, plugins) are not in it; config/.env is generated above.
      - name: Pack release
        run: |
          cat > exclude.lst <<'EOF'
          .git*
          .mango-snippet.html
          */.git*
          node_modules/*
          docker/*
          docker-compose.yml
          Dockerfile
          tests/*
          packages/*
          deploy.sample.sh
          README.md
          composer.json
          composer.lock
          package.json
          package-lock.json
          mango.json
          config/.env.sample
          public/wp-content/uploads/*
          public/wp-content/cache/*
          public/wp-content/webp-express/*
          public/wp-content/aiowps_backups/*
          public/wp-content/plugins/*
          public/maintenance.php
          log/*
          temp/cache/*
          exclude.lst
          release.zip
          EOF
          zip -r -q -9 release.zip . -x@exclude.lst
          # block web access to these, they are otherwise excluded from the archive
          zip -q release.zip log/.htaccess temp/.htaccess
          ls -lh release.zip
          echo "files in archive: $(unzip -Z1 release.zip | wc -l)"
          unzip -Z1 release.zip | grep -qx 'config/.env' || { echo "::error::config/.env is missing from the release"; exit 1; }
          for forbidden in public/wp-content/uploads; do
            if unzip -Z1 release.zip | grep -q "^$forbidden"; then
              echo "::error::$forbidden must not be in the release"
              exit 1
            fi
          done

      - name: Install lftp
        if: env.DRY_RUN != 'true'
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Upload release
        if: env.DRY_RUN != 'true'
        timeout-minutes: 20
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
        run: |
          EXTRACTOR="deploy-${GITHUB_RUN_ID}.php"
          echo "EXTRACTOR=$EXTRACTOR" >> "$GITHUB_ENV"
          HASH=$(printf %s "$DEPLOY_TOKEN" | sha256sum | cut -d' ' -f1)
          sed "s/__TOKEN_HASH__/$HASH/" .github/deploy-extract.php > "$EXTRACTOR"
          printf '<?php http_response_code(503); header("Retry-After: 300"); echo "Probíhá aktualizace webu, zkuste to za chvíli.";\n' > maintenance.php
          lftp -u "$FTP_USER,$FTP_PASSWORD" "ftp://$FTP_HOST" -e "set cmd:fail-exit yes; set net:timeout 30; set net:max-retries 5; set net:reconnect-interval-base 5; set ftp:ssl-force true; set ftp:ssl-protect-data true; set ssl:verify-certificate yes; \
            put -O ${FTP_DIR}public/ maintenance.php; \
            put -c -O ${FTP_DIR} release.zip; \
            put -O ${FTP_DIR}public/ $EXTRACTOR; bye"

      - name: Unpack on the server
        if: env.DRY_RUN != 'true'
        env:
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
        run: |
          curl --fail --silent --show-error --max-time 900 \
            --data-urlencode "token=$DEPLOY_TOKEN" \
            "https://praha.skauting.cz/public/$EXTRACTOR" | tee extract.out
          grep -q '^DEPLOY_OK' extract.out

      - name: Remove leftovers from the server
        if: always() && env.DRY_RUN != 'true'
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          # the extractor deletes these itself on success; this covers failed runs
          lftp -u "$FTP_USER,$FTP_PASSWORD" "ftp://$FTP_HOST" -e "set ftp:ssl-force true; set net:timeout 30; set net:max-retries 2; \
            rm -f ${FTP_DIR}release.zip; rm -f ${FTP_DIR}public/deploy-${GITHUB_RUN_ID}.php; bye" || true

      - name: Smoke test
        if: env.DRY_RUN != 'true'
        run: curl --fail --silent --show-error --output /dev/null https://praha.skauting.cz/

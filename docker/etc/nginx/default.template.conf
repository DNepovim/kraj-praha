# Nginx configuration

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name ${NGINX_HOST};

    index index.php index.html;
    error_log  /var/log/nginx/error.log;
    access_log /var/log/nginx/access.log;
    root /var/www/html/public;


    # Uploads missing locally are loaded from production
    location ~ ^/wp-content/(uploads|webp-express)/ {
        try_files $uri @production_uploads;
    }

    location @production_uploads {
        resolver 127.0.0.11 valid=300s;
        set $production https://praha.skauting.cz;
        proxy_pass $production$request_uri;
        proxy_ssl_server_name on;
        proxy_set_header Host praha.skauting.cz;
    }

    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass php:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
    }
}

